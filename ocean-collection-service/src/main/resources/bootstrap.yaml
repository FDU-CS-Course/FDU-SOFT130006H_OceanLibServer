spring:
  profiles:
    active: devx
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  application:
    name: ocean-collection-service
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: DEFAULT_GROUP
      discovery:
        server-addr: 127.0.0.1:8848
dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: 2a9c5897-b4a7-4825-9c0c-fabcf61a5863
      group: dubbo
  protocol:
    name: dubbo
    port: -1
    serialization: kryo
  consumer:
    check: false
